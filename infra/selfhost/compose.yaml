services:
  # Edge Reverse Proxy - The ONLY service reachable from outside
  caddy:
    image: caddy:2.9-alpine
    container_name: hrflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      api-gateway:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Gateway - Connects Edge to Internal backend
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_MODULE: api-gateway
    container_name: hrflow-api-gateway
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_PORT: 8080
      IDENTITY_URI: http://identity-org:8101
      HRFLOW_AUTH_JWKS_URI: http://identity-org:8101/.well-known/jwks.json
      HRFLOW_AUTH_BROWSER_ORIGIN: https://hrflow.test
    networks:
      - edge
      - internal
    depends_on:
      identity-org:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Identity & Organization Service - Authentication & User Context
  identity-org:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_MODULE: identity-org
    container_name: hrflow-identity-org
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_PORT: 8101
      DB_URL: jdbc:postgresql://postgres:5432/hrflow
      DB_USERNAME: hrflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hrflow}
      FLYWAY_USERNAME: hrflow
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-hrflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      HRFLOW_AUTH_LOCAL_BOOTSTRAP: "true"
      HRFLOW_AUTH_DEV_PASSWORD: ${HRFLOW_DEV_PASSWORD:-}
      HRFLOW_AUTH_SECURE_COOKIES: "true"
      HRFLOW_AUTH_BROWSER_ORIGIN: https://hrflow.test
    volumes:
      - jwtkeys:/keys
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8101/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database - Isolated on internal network (NO published ports!)
  postgres:
    image: postgres:18-alpine
    container_name: hrflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrflow}
      POSTGRES_DB: hrflow
    volumes:
      - pgdata18:/var/lib/postgresql
      - ../docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrflow -d hrflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Apache Kafka Broker - Isolated on internal network (NO published ports!)
  kafka:
    image: confluentinc/cp-kafka:8.2.0
    container_name: hrflow-kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafkadata_v2:/var/lib/kafka/data
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Confluent Schema Registry - Isolated on internal network
  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    container_name: hrflow-schema-registry
    hostname: schema-registry
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    networks:
      - internal
    depends_on:
      - kafka
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: hrflow-edge
    driver: bridge
  internal:
    name: hrflow-internal
    driver: bridge

volumes:
  pgdata18:
  kafkadata_v2:
  jwtkeys:
  caddy_data:
  caddy_config:
