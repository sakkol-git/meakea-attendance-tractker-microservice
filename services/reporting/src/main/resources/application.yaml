# Run from this service directory or the HRFlow repository root.
spring:
  application:
    name: reporting
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./services/reporting/.env[.properties]"
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrflow}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: reporting-pool
      schema: reporting
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 0
      connection-timeout: 5000
      validation-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1500000
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 30
        tcpKeepAlive: true
  flyway:
    enabled: true
    schemas: reporting
    default-schema: reporting
    create-schemas: false
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
      auto.register.schemas: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    consumer:
      group-id: hrflow-reporting-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 100
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true
        allow.auto.create.topics: false
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
      ack-mode: manual_immediate
      missing-topics-fatal: ${KAFKA_LISTENER_MISSING_TOPICS_FATAL:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8106}
  shutdown: graceful
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9106}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO

hrflow:
  reporting:
    request-consumer:
      enabled: ${REPORTING_REQUEST_CONSUMER_ENABLED:false}
      bootstrap-timeout-ms: ${REPORTING_REQUEST_BOOTSTRAP_TIMEOUT_MS:60000}
    daily-consumer:
      enabled: ${REPORTING_DAILY_CONSUMER_ENABLED:false}
    leave-consumer:
      enabled: ${REPORTING_LEAVE_CONSUMER_ENABLED:false}
    employee-consumer:
      enabled: ${REPORTING_EMPLOYEE_CONSUMER_ENABLED:false}
      bootstrap-timeout-ms: ${REPORTING_EMPLOYEE_BOOTSTRAP_TIMEOUT_MS:60000}
    session-consumer:
      enabled: ${REPORTING_SESSION_CONSUMER_ENABLED:false}
    kafka-consumer:
      enabled: ${REPORTING_KAFKA_CONSUMER_ENABLED:false}
    topics:
      attendance-facts: ${REPORTING_TOPIC_ATTENDANCE_FACTS:hrflow.attendance.facts}
      leave-facts: ${REPORTING_TOPIC_LEAVE_FACTS:hrflow.leave.facts}
      request-facts: ${REPORTING_TOPIC_REQUEST_FACTS:hrflow.request.facts}
    export:
      storage-dir: ${REPORTING_EXPORT_STORAGE_DIR:${java.io.tmpdir}/hrflow-exports}
      row-cap: ${REPORTING_EXPORT_ROW_CAP:10000}
      worker:
        enabled: ${REPORTING_EXPORT_WORKER_ENABLED:false}
        job-user: ${REPORTING_JOB_USER:}
        job-password: ${REPORTING_JOB_PASSWORD:}
