# Run from this service directory or the HRFlow repository root.
spring:
  application:
    name: api-gateway
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./services/api-gateway/.env[.properties]"
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  main:
    web-application-type: reactive
  webflux:
    problemdetails:
      enabled: true
  http:
    codecs:
      max-in-memory-size: 1MB
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          routes:
            - id: identity-session
              uri: ${IDENTITY_URI:http://localhost:8101}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/.well-known/jwks.json,/api/v1/audit-logs
              filters:
                - StripPrefix=2
            - id: identity-organization
              uri: ${IDENTITY_URI:http://localhost:8101}
              predicates:
                - Path=/api/v1/departments,/api/v1/positions,/api/v2/employees,/api/v2/employees/*,/api/v2/employees/*/shifts,/api/v2/work-sites,/api/v2/work-sites/*,/api/v2/shifts,/api/v2/shifts/*,/api/v2/shift-assignments,/api/v2/shift-assignments/*/close,/api/v2/holidays,/api/v2/holidays/*
              filters:
                - StripPrefix=2
            - id: attendance-service
              uri: ${ATTENDANCE_URI:http://localhost:8102}
              predicates:
                - Path=/api/v1/attendance/**
              filters:
                - StripPrefix=2
            - id: notification-service
              uri: ${NOTIFICATION_URI:http://localhost:8105}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - StripPrefix=2
            - id: leave-service
              uri: ${LEAVE_URI:http://localhost:8103}
              predicates:
                - Path=/api/v1/leave/**
              filters:
                - StripPrefix=2
            - id: request-service
              uri: ${REQUEST_URI:http://localhost:8104}
              predicates:
                - Path=/api/v1/requests/**,/api/v1/materials/**
              filters:
                - StripPrefix=2
            - id: reporting-service
              uri: ${REPORTING_URI:http://localhost:8106}
              predicates:
                - Path=/api/v1/reports/**
              filters:
                - StripPrefix=2

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO
