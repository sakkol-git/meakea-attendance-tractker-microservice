name: Cross-repository integration baseline
on:
  workflow_dispatch:
    inputs:
      web_sha:
        description: Exact web commit SHA including its contract bundle and tests
        required: true
        type: string
      mobile_sha:
        description: Exact mobile commit SHA including its contract bundle and tests
        required: true
        type: string
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require immutable client revisions
        env:
          WEB_SHA: ${{ inputs.web_sha }}
          MOBILE_SHA: ${{ inputs.mobile_sha }}
        run: |
          python3 - <<'PY'
          import os, re
          for key in ('WEB_SHA', 'MOBILE_SHA'):
              if not re.fullmatch(r'[0-9a-fA-F]{40}', os.environ[key]):
                  raise SystemExit(f'{key} must be an exact 40-character commit SHA')
          PY
      - uses: actions/checkout@v4
        with:
          repository: sakkol-git/meakea-attendance-tractker-frontend
          ref: ${{ inputs.web_sha }}
          path: web
          token: ${{ secrets.HRFLOW_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sakkol-git/meakea-attendance-tractker-mobile-app
          ref: ${{ inputs.mobile_sha }}
          path: mobile
          token: ${{ secrets.HRFLOW_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Read repository Flutter pin
        id: sdk
        run: python3 -c 'import json,os; open(os.environ["GITHUB_OUTPUT"], "a").write("version=" + json.load(open("mobile/.fvmrc"))["flutter"] + "\n")'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ripgrep
      - run: python -m pip install -r tools/project_mcp/requirements.txt
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: flutter pub get
        working-directory: mobile
      - run: python scripts/project-context.py
      - run: python scripts/verify-project.py
